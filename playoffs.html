<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NFL Rivals B — Playoffs</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body { margin:0; background:#0a2342; color:#fff; font-family:'Inter',Arial,sans-serif; padding:20px; }
h1 { font-family:'Oswald',Arial,sans-serif; color:#FB4F14; text-align:center; font-size:2.5em; margin:10px 0 30px; letter-spacing:0.05em; }
.back { display:inline-block; padding:10px 20px; background:#FB4F14; color:#fff; text-decoration:none; border-radius:5px; margin-bottom:20px; }
.bracket { display:flex; gap:40px; justify-content:center; align-items:center; max-width:1400px; margin:0 auto; flex-wrap:wrap; }
.round { display:flex; flex-direction:column; gap:30px; }
.round h2 { font-size:0.9em; color:#FB4F14; text-align:center; text-transform:uppercase; letter-spacing:0.15em; margin:0 0 10px; font-family:'Oswald',Arial,sans-serif; }
.matchup { background:rgba(255,255,255,0.05); border-radius:12px; padding:12px; display:flex; flex-direction:column; gap:8px; min-width:180px; }
.team { display:flex; align-items:center; gap:10px; padding:8px; border-radius:8px; background:rgba(0,0,0,0.3); position:relative; }
.team img { height:50px; width:50px; object-fit:contain; }
.team .seed { font-size:0.75em; color:#FB4F14; font-weight:700; min-width:20px; }
.team .score { font-size:1.3em; font-weight:700; margin-left:auto; }
.team.winner { background:rgba(255,255,255,0.15); border:2px solid #FB4F14; font-weight:700; }
.team.loser img { filter:grayscale(100%) opacity(0.35); }
.team.loser::before { content:""; position:absolute; left:45px; top:50%; width:55px; height:55px; border:4px solid #ff2020; border-radius:50%; transform:translate(-50%,-50%); pointer-events:none; z-index:2; }
.team.loser::after { content:""; position:absolute; left:45px; top:50%; width:55px; height:4px; background:#ff2020; transform:translate(-50%,-50%) rotate(-45deg); pointer-events:none; z-index:3; }
.champion { display:flex; flex-direction:column; align-items:center; gap:10px; }
.champion img { height:120px; }
.trophy { font-size:3em; text-align:center; }
</style>
</head>
<body>
<a href="index.html" class="back">&larr; Back to League Home</a>
<h1>&#127942; NFL Rivals B &mdash; Playoff Bracket</h1>
<div class="bracket">
  <div class="round">
    <h2>Quarterfinals</h2>
    <div class="matchup">
      <div class="team winner"><span class="seed">1</span><img src="logos/baltimore-ravens-logo.png" alt=""><span class="score">--</span></div>
      <div class="team loser"><span class="seed">8</span><img src="logos/kansas-city-chiefs-logo.png" alt=""><span class="score">--</span></div>
    </div>
    <div class="matchup">
      <div class="team winner"><span class="seed">4</span><img src="logos/carolina-panthers-logo.png" alt=""><span class="score">--</span></div>
      <div class="team loser"><span class="seed">5</span><img src="logos/denver-broncos-logo.png" alt=""><span class="score">--</span></div>
    </div>
    <div class="matchup">
      <div class="team winner"><span class="seed">2</span><img src="logos/los-angeles-chargers-logo.png" alt=""><span class="score">--</span></div>
      <div class="team loser"><span class="seed">7</span><img src="logos/cleveland-browns-logo.png" alt=""><span class="score">--</span></div>
    </div>
    <div class="matchup">
      <div class="team winner"><span class="seed">3</span><img src="logos/atlanta-falcons-logo.png" alt=""><span class="score">--</span></div>
      <div class="team loser"><span class="seed">6</span><img src="logos/oakland-raiders-logo.png" alt=""><span class="score">--</span></div>
    </div>
  </div>
  <div class="round">
    <h2>Semifinals</h2>
    <div class="matchup">
      <div class="team winner"><img src="logos/baltimore-ravens-logo.png" alt=""><span class="score">--</span></div>
      <div class="team loser"><img src="logos/carolina-panthers-logo.png" alt=""><span class="score">--</span></div>
    </div>
    <div class="matchup">
      <div class="team winner"><img src="logos/los-angeles-chargers-logo.png" alt=""><span class="score">--</span></div>
      <div class="team loser"><img src="logos/atlanta-falcons-logo.png" alt=""><span class="score">--</span></div>
    </div>
  </div>
  <div class="round">
    <h2>Championship</h2>
    <div class="matchup">
      <div class="team winner"><img src="logos/baltimore-ravens-logo.png" alt=""><span class="score">--</span></div>
      <div class="team loser"><img src="logos/los-angeles-chargers-logo.png" alt=""><span class="score">--</span></div>
    </div>
  </div>
  <div class="champion">
    <h2 style="color:#FB4F14;">Champion</h2>
    <div class="trophy">&#127942;</div>
    <img src="logos/baltimore-ravens-logo.png" alt="Champion">
  </div>
</div>
</body>
</html>
