<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>NFL Rivals B — Playoffs</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body { margin:0; background:#0a2342; color:#fff; font-family:'Inter',Arial,sans-serif; padding:20px; }
h1 { font-family:'Oswald',Arial,sans-serif; color:#FB4F14; text-align:center; font-size:2.5em; margin:10px 0 10px; letter-spacing:0.05em; }
.sub { text-align:center; color:#FB4F14; font-size:0.9em; letter-spacing:0.15em; text-transform:uppercase; margin-bottom:30px; }
.back { display:inline-block; padding:10px 20px; background:#FB4F14; color:#fff; text-decoration:none; border-radius:5px; margin-bottom:20px; }
.bracket { display:flex; gap:50px; justify-content:center; align-items:center; max-width:1400px; margin:0 auto; flex-wrap:wrap; }
.round { display:flex; flex-direction:column; gap:30px; }
.round h2 { font-size:0.9em; color:#FB4F14; text-align:center; text-transform:uppercase; letter-spacing:0.15em; margin:0 0 10px; font-family:'Oswald',Arial,sans-serif; }
.matchup { background:rgba(255,255,255,0.05); border-radius:12px; padding:16px; display:flex; flex-direction:column; gap:10px; min-width:150px; }
.team { display:flex; align-items:center; justify-content:center; padding:12px; border-radius:8px; background:rgba(0,0,0,0.35); }
.team .seed { font-family:'Oswald',Arial,sans-serif; font-size:1.8em; font-weight:700; color:#FB4F14; }
.placeholder-note { text-align:center; margin:50px auto; max-width:600px; color:rgba(255,255,255,0.5); font-size:0.85em; line-height:1.6; }
</style>
</head>
<body>
<a href="index.html" class="back">&larr; Back to League Home</a>
<h1>&#127942; NFL Rivals B</h1>
<div class="sub">Playoff Bracket &mdash; Awaiting Seeds</div>
<div class="bracket">
  <div class="round"><h2>Quarterfinals</h2>
    <div class="matchup"><div class="team"><span class="seed">1</span></div><div class="team"><span class="seed">8</span></div></div>
    <div class="matchup"><div class="team"><span class="seed">4</span></div><div class="team"><span class="seed">5</span></div></div>
    <div class="matchup"><div class="team"><span class="seed">2</span></div><div class="team"><span class="seed">7</span></div></div>
    <div class="matchup"><div class="team"><span class="seed">3</span></div><div class="team"><span class="seed">6</span></div></div>
  </div>
  <div class="round"><h2>Semifinals</h2>
    <div class="matchup"><div class="team"><span class="seed">--</span></div><div class="team"><span class="seed">--</span></div></div>
    <div class="matchup"><div class="team"><span class="seed">--</span></div><div class="team"><span class="seed">--</span></div></div>
  </div>
  <div class="round"><h2>Championship</h2>
    <div class="matchup"><div class="team"><span class="seed">--</span></div><div class="team"><span class="seed">--</span></div></div>
  </div>
  <div class="round"><h2>Champion</h2>
    <div class="matchup"><div class="team"><span class="seed">--</span></div></div>
  </div>
</div>
<div class="placeholder-note">Seeds will be filled in once the regular season concludes.<br>Team logos and scores will appear here automatically.</div>
</body>
</html>
